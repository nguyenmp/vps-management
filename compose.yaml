---
services:
  caddy:
    image: caddy:latest
    environment:
      - MARIMO_PASSWORD_HASH=${MARIMO_PASSWORD_HASH:?error}
      - SIMPLEARCHIVE_PASSWORD_HASH=${SIMPLEARCHIVE_PASSWORD_HASH:?error}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data/:/data/
      - ./caddy-config/:/config/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:80"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  hikariita:
    build: https://github.com/nguyenmp/hikariita.git
    volumes:
      - ${HIKARIITA_DB_FILE:?error}:/usr/src/app/example.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:80/"]
      interval: 61s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  simplearchive:
    build:
      context: https://github.com/nguyenmp/simplearchive.git
      target: runtime
    environment:
      - SERVE_ADDR=0.0.0.0:8080
      - LOG_LEVEL=info
    volumes:
      - ./simplearchive-data:/data
    expose:
      - 8080
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www/:/etc/nginx/www/:ro
    environment:
      - NGINX_PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:80/"]
      interval: 62s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io
    environment:
      - BASE_URL=changes.href.cat
      # Alternative target "Chrome" Playwright URL, do not use "'s or 's!
      # "Playwright" is a driver/librarythat allows changedetection to talk to a Chrome or similar browser.
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
    volumes:
      - ./changedetection-data/:/datastore/
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import requests; requests.get(''http://localhost:5000'').raise_for_status()"',
        ]
      interval: 63s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
    # If WEBDRIVER or PLAYWRIGHT are enabled, changedetection container depends on that
    # and must wait before starting (substitute "browser-chrome" with "playwright-chrome" if last one is used)
    depends_on:
      sockpuppetbrowser:
        condition: service_started
  # Sockpuppetbrowser is basically chrome wrapped in an API for allowing fast fetching of web-pages.
  # RECOMMENDED FOR FETCHING PAGES WITH CHROME
  sockpuppetbrowser:
    hostname: sockpuppetbrowser
    image: dgtlmoon/sockpuppetbrowser:latest
    cpus: 0.5
    cap_add:
      - SYS_ADMIN
    # SYS_ADMIN might be too much, but it can be needed on your platform https://github.com/puppeteer/puppeteer/blob/main/docs/troubleshooting.md#running-puppeteer-on-gitlabci
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
  tor-socks-proxy:
    image: peterdavehello/tor-socks-proxy
    expose:
      - 9150
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "curl", "icanhazip.com", "-x", "socks5://localhost:9150"]
      interval: 65s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  postgres-recipes:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:?error}
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
    volumes:
      - ./postgres-recipes-data/:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 67s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
  pgbackups3:
    build:
      context: https://github.com/miharekar/postgres-backup-s3.git
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:?error}
    links:
      - postgres-recipes
    depends_on:
      postgres-recipes:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SCHEDULE: "@daily"
      # S3_REGION: region
      S3_ACCESS_KEY_ID: ${POSTGRES_BACKUP_S3_ACCESS_KEY_ID:?error}
      S3_SECRET_ACCESS_KEY: ${POSTGRES_BACKUP_S3_SECRET_ACCESS_KEY:?error}
      S3_BUCKET: recipes.backup.production
      S3_PREFIX: backup_${STAGE:?error}
      POSTGRES_DATABASE: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_EXTRA_OPTS: "--schema=public --blobs"
      POSTGRES_HOST: postgres-recipes

  lowcoder-all-in-one:
    image: lowcoderorg/lowcoder-ce:latest
    expose:
      - 3000
      - 3443
    env_file:
      - envs/lowcoder-default.env
    restart: unless-stopped
    volumes:
      - ./lowcoder-data/stacks/:/lowcoder-stacks
      - ./lowcoder-data/assets/:/lowcoder/assets
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3000/api/status/health"]
      interval: 70s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  n8n:
    build: n8n/.
    environment:
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=n8n.href.cat
      # https://docs.n8n.io/hosting/configuration/configuration-examples/webhook-url/
      - WEBHOOK_URL=${N8N_WEBHOOK_URL?error}

      # Trust the X-forwarded-for header from the reverse proxy
      # https://community.n8n.io/t/x-forwarded-for-header-is-set-but-the-express-trust-proxy-s/51208
      - N8N_PROXY_HOPS=1

      - GENERIC_TIMEZONE=America/Los_Angeles

      # This database was inited by:
      # exec-ing into the container
      # psql -h localhost -U postgres
      # CREATE DATABASE n8n;
      # then restore from n8n;;;
      # cd .n8n/
      # mkdir backup
      # https://docs.n8n.io/hosting/cli-commands/#export-entities
      # n8n export:workflow --backup --output=backup/workflows/
      # n8n export:credentials --backup --output=backup/credentials/
      # n8n export:entities --outputDir=./backup/ # --includeExecutionHistoryDataTables=true
      # manually reinstall community nodes and API keys
      # Reactivate license
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-recipes
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n_login
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:?error}
      - DB_POSTGRESDB_SCHEMA=public

      - EXECUTIONS_MODE=queue
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379

      - NODES_EXCLUDE="[]"
      - N8N_RESTRICT_FILE_ACCESS_TO="/home/node/.n8n-files/;/tmp/;/home/node/"
    expose:
      - 5678
    restart: unless-stopped
    volumes:
      - ./n8n-data/:/home/node/.n8n
    depends_on:
      postgres-recipes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "http://localhost:5678/", "-O", "/dev/null"]
      interval: 71s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  n8n-worker:
    # docker run --name n8n-queue -p 5679:5678 docker.n8n.io/n8nio/n8n worker
    command: worker
    build: n8n/.
    environment:
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # https://docs.n8n.io/hosting/configuration/configuration-examples/webhook-url/
      - WEBHOOK_URL=${N8N_WEBHOOK_URL?error}

      # Trust the X-forwarded-for header from the reverse proxy
      # https://community.n8n.io/t/x-forwarded-for-header-is-set-but-the-express-trust-proxy-s/51208
      - N8N_PROXY_HOPS=1

      - GENERIC_TIMEZONE=America/Los_Angeles

      # This database was inited by:
      # exec-ing into the container
      # psql -h localhost -U postgres
      # CREATE DATABASE n8n;
      # then restore from n8n;;;
      # cd .n8n/
      # mkdir backup
      # https://docs.n8n.io/hosting/cli-commands/#export-entities
      # n8n export:workflow --backup --output=backup/workflows/
      # n8n export:credentials --backup --output=backup/credentials/
      # n8n export:entities --outputDir=./backup/ # --includeExecutionHistoryDataTables=true
      # manually reinstall community nodes and API keys
      # Reactivate license
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-recipes
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n_login
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:?error}
      - DB_POSTGRESDB_SCHEMA=public

      - EXECUTIONS_MODE=queue
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true

      - NODES_EXCLUDE="[]"
      - N8N_RESTRICT_FILE_ACCESS_TO="/home/node/.n8n-files/;/tmp/;/home/node/"
    expose:
      - 5678
    restart: unless-stopped
    volumes:
      - ./n8n-data/:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgres-recipes:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "http://localhost:5678/healthz/readiness",
          "-O",
          "/dev/null",
        ]
      interval: 71s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  redis:
    # docker run --name some-redis -p 6379:6379  -d redis
    image: redis:latest
    expose:
      - 6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 72s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  telegraf:
    image: telegraf:latest
    restart: unless-stopped
    user: root
    ports:
      - 9273:9273
    entrypoint: "telegraf"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    command:
      - "--path.rootfs=/host"
    network_mode: host
    restart: unless-stopped
    volumes:
      - /:/host:ro
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - ALLOY_LOG_LEVEL=info
      - GCLOUD_FM_COLLECTOR_ID=${GCLOUD_FM_COLLECTOR_ID:?error}
      - GCLOUD_RW_API_KEY=${GCLOUD_RW_API_KEY:?error}
      - DOCKER_HOSTNAME=${HOSTNAME:?error}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro

  portainer:
    image: portainer/portainer-ce:lts
    environment:
      - TRUSTED_ORIGINS=origin.portainer.href.cat,portainer.href.cat,portainer.docker.localhost
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data/:/data

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    volumes:
      - ./audiobookshelf-data/audiobooks:/audiobooks
      - ./audiobookshelf-data/podcasts:/podcasts
      - ./audiobookshelf-data/config:/config
      - ./audiobookshelf-data/metadata:/metadata
    restart: unless-stopped
    environment:
      - TZ="America/Los_Angeles"
  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    environment:
      - ENV=dev
    volumes:
      - ./open-webui-data/:/app/backend/data
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/"]
      interval: 66s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 9
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - STORE_MODEL_IN_DB=true
      - LITELLM_MASTER_KEY=${LITELLM_ADMIN_PASSWORD:?error}
      - DATABASE_URL=postgresql://litellm_login:${LITELLM_POSTGRES_PASSWORD:?error}@postgres-recipes:5432/litellm_db
      - PROXY_BASE_URL=https://litellm.href.cat
    depends_on:
      postgres-recipes:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests ; requests.get('http://localhost:4000').raise_for_status()",
        ]
      interval: 66s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  marimo:
    image: ghcr.io/marimo-team/marimo:latest
    volumes:
      - ./marimo-data/:/app/
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request ; urllib.request.urlopen(urllib.request.Request('http://localhost:8080'))",
        ]
      interval: 66s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5

  syncthing:
    image: syncthing/syncthing
    hostname: syncthing.href.cat
    expose:
      # Web UI
      - 8384
    ports:
      # Sync protocol listening port
      - 22000:22000/tcp
      # NAT‑punching ports
      - 22000:22000/udp
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./syncthing-data/:/var/syncthing
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3

  vikunja:
    image: vikunja/vikunja:2.3.0
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.href.cat/
      VIKUNJA_SERVICE_SECRET: b3e1717c7222092a57d6052c8564f79217f4d1b47d81895d3dec7b5cd19a1356
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    expose:
      - 3456
    volumes:
      - ./vikunja-data/files:/app/vikunja/files
      - ./vikunja-data/db:/db
    restart: unless-stopped

  sparkling-axolotl-jump:
    build: https://github.com/nguyenmp/sparkling-axolotl-jump.git
    environment:
      - DATABASE_URL=${RECIPES_DATABASE_URL:?error}
      - NITRO_AUTH_PASSWORD=${RECIPES_PASSWORD:?error}
    expose:
      - 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "http://127.0.0.1:8080/", "-O", "/dev/null"]
      interval: 73s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 5
volumes:
  changedetection-data:
